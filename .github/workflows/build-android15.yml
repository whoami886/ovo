name: Build ovo.ko

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'ovo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git curl bc bison flex libelf-dev libssl-dev \
            python3 rsync make clang lld llvm
          clang --version

      - name: Sync kernel source
        run: |
          mkdir -p $GITHUB_WORKSPACE/k && cd $GITHUB_WORKSPACE/k
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b common-android15-6.6-2025-09 --repo-rev=v2.16
          repo sync -c -j$(nproc) --no-tags
          echo "=== check abi file ==="
          ls -l common/android/abi_gki_protected_exports_aarch64 || echo "MISSING"

      - name: Build ovo.ko
        run: |
          OUT=$GITHUB_WORKSPACE/k/out
          cd $GITHUB_WORKSPACE/k/common
          export ARCH=arm64
          export LLVM=1
          make O=$OUT gki_defconfig
          make O=$OUT prepare
          make O=$OUT modules_prepare
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" | head -20
          MODDIR=$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name Makefile | grep -v '/k/' | head -1)")
          echo "MODDIR=$MODDIR"
          ls -la "$MODDIR"
          make O=$OUT M="$MODDIR" modules -j$(nproc)
          echo "=== ko files ==="
          find $GITHUB_WORKSPACE -name "*.ko" -ls

      - name: Collect
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/art
          find $GITHUB_WORKSPACE -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/art/ \; || true
          ls -l $GITHUB_WORKSPACE/art

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovo-ko
          path: $GITHUB_WORKSPACE/art/
